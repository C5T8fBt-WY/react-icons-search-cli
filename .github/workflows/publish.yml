name: Auto Version & Publish to npm

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-and-publish:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Configure Git
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Determine release version
        id: version
        shell: bash
        run: |
          latest_tag="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"

          if [ -z "${latest_tag}" ]; then
            current_version="$(node -p "require('./package.json').version")"
          else
            current_version="${latest_tag#v}"
          fi

          head_tag="$(git tag --points-at HEAD | grep '^v' | head -n 1 || true)"
          if [ -n "${head_tag}" ]; then
            new_version="${head_tag#v}"
            tag_exists=true
          else
            new_version="$(node -e '
              const parts = process.argv[1].split(".").map(Number);
              if (parts.length !== 3 || parts.some(Number.isNaN)) process.exit(1);
              console.log(`${parts[0]}.${parts[1]}.${parts[2] + 1}`);
            ' "${current_version}")"
            tag_exists=false
          fi

          echo "current=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "new=${new_version}" >> "${GITHUB_OUTPUT}"
          echo "tag_exists=${tag_exists}" >> "${GITHUB_OUTPUT}"
          echo "Latest tag: ${latest_tag:-none}"
          echo "Release version: ${new_version}"

      - name: Check npm package version
        id: registry
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_spec="${package_name}@${{ steps.version.outputs.new }}"

          set +e
          view_output="$(npm view "${package_spec}" version --json 2>&1)"
          view_status=$?
          set -e

          if [ "${view_status}" -eq 0 ]; then
            should_publish=false
          elif printf '%s' "${view_output}" | grep -q "E404"; then
            should_publish=true
          else
            printf '%s\n' "${view_output}" >&2
            exit "${view_status}"
          fi

          echo "package_name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "should_publish=${should_publish}" >> "${GITHUB_OUTPUT}"

      - name: Update package version
        if: steps.registry.outputs.should_publish == 'true' && steps.version.outputs.tag_exists == 'false'
        run: npm version "${{ steps.version.outputs.new }}" --no-git-tag-version

      - name: Install dependencies
        if: steps.registry.outputs.should_publish == 'true'
        run: npm ci

      - name: Verify package
        if: steps.registry.outputs.should_publish == 'true'
        run: npm run verify

      - name: Commit version and push tag
        if: steps.registry.outputs.should_publish == 'true' && steps.version.outputs.tag_exists == 'false'
        shell: bash
        run: |
          version="${{ steps.version.outputs.new }}"
          git add package.json package-lock.json
          git commit -m "chore(release): v${version} [skip ci]"
          git tag -a "v${version}" -m "Release v${version}"
          git push origin main
          git push origin "v${version}"

      - name: Create GitHub Release
        if: steps.registry.outputs.should_publish == 'true' && steps.version.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: Release v${{ steps.version.outputs.new }}
          generate_release_notes: true

      - name: Publish to npm
        if: steps.registry.outputs.should_publish == 'true'
        run: npm publish --provenance

      - name: Summarize release
        shell: bash
        run: |
          if [ "${{ steps.registry.outputs.should_publish }}" = "true" ]; then
            echo "Published ${{ steps.registry.outputs.package_name }}@${{ steps.version.outputs.new }}." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Skipped ${{ steps.registry.outputs.package_name }}@${{ steps.version.outputs.new }} because it already exists on npm." >> "${GITHUB_STEP_SUMMARY}"
          fi
